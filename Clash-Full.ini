; OpenClash 若启用了“测速地址/间隔覆写”或全局“延迟容差”，应同步设为 30 秒和 80ms，否则会覆盖这里的参数。
; 香港、台湾、日本、新加坡、韩国、美国使用独立自动组；其余任意国家/地区及未知命名节点自动进入“其他-自动”。
; “其他-自动”采用排除核心地区的兜底规则，不再依赖逐国关键词，因此新增国家节点无需继续修改本文件。
