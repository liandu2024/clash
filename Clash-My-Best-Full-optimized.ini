; 【P0 修复】Global.list（35278 条）已移除，原因有三：
;   1. 加上它总规则约 4.5 万条，超过 subconverter 默认 max_allowed_rules=32768，
;      超出部分被静默丢弃（ruleconvert.cpp 里是 break 而不是报错），
;      而 Global.list 的 36 条 DOMAIN-KEYWORD 和 115 条 IP-CIDR 恰好排在文件末尾，整类失效。
;   2. 它并非“纯国外”：里面有 weibo/qq/iqiyi 和 9 条 .cn 域名，会让国内站点走代理。
;   3. 去掉后由 GEOIP,CN + FINAL 兜底，语义更清晰：国内 IP 直连，其余走代理。
; 若你确实需要它，见 README 的“如何加回 Global.list”，必须同时放开 max_allowed_rules。
ruleset=➡️ 国内,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/China/China.list
ruleset=🌍 国外,https://cdn.jsdelivr.net/gh/liandu2024/clash@main/list/Check.list
ruleset=🌍 国外,https://cdn.jsdelivr.net/gh/liandu2024/clash@main/list/Proxy.list
ruleset=➡️ 国内,[]GEOIP,CN,no-resolve
ruleset=🌍 国外,[]FINAL

