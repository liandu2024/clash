; ---- 节点组 ----
; 【P0 修复】原版写 `300,5,80`，subconverter 按 interval,timeout,tolerance 解析，
; 得到 timeout=5；而 mihomo 的 timeout 单位是【毫秒】（wiki + healthcheck.go），
; 即 5ms —— 每次测速必然超时，所有节点被判不可用，url-test 退化成“永远用第一个节点”。
; 这里统一改为 `300,5000,80`：300 秒测一次、5 秒超时、80ms 容差。
;
; 组数量从 49 个 url-test 精简到 14 个：4GB 内存的 N100 上，
; 每个 url-test 组都会对全部节点做并发健康检查，49 组属于纯浪费。
custom_proxy_group=所有-手动`select`.*
custom_proxy_group=所有-自动`url-test`.*`http://cp.cloudflare.com/generate_204`300,5000,80
custom_proxy_group=港台日新韩-自动`url-test`(?i)(广港|广台|广日|广新|广韩|香港|Hong[ ._-]?Kong|🇭🇰|台湾|台灣|Tai[ ._-]?Wan|🇹🇼|日本|东京|東京|大阪|🇯🇵|Japan|新加坡|狮城|獅城|🇸🇬|Singapore|韩国|韓國|首尔|首爾|🇰🇷|Korea|(^|[^A-Za-z])(HK|TW|JP|SG|KR)([^A-Za-z]|$))`http://cp.cloudflare.com/generate_204`300,5000,80
