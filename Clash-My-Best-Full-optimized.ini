[custom]
; ============================================================================
; 优化版 Clash 规则模板（subconverter 外部配置）
; 规则顺序：私网/个人例外 -> 服务规则 -> 国内域名 -> 国外规则 -> 国内 IP -> 兜底
; 本版相对原版的改动见同目录 README.md
; ============================================================================

; 【P0 修复】GEOIP,private 不是合法的国家代码：
;   geodata-mode=true 时会让整份配置加载失败，false 时查库查不到、规则永不命中。
;   正确写法是 GEOIP,lan（mihomo 源码 rules/common/geoip.go 里仅对 "lan" 做特判）。
ruleset=🎯 直连,[]GEOIP,lan,no-resolve

; 个人例外列表：优先级最高，命中即定，不再往后匹配。
; 【注意】这两个 list 里出现的域名会“抢占”后面所有品牌组，请只放真正需要覆盖的条目。
ruleset=🚌 个人直连,https://cdn.jsdelivr.net/gh/yangdong123/clash@dev/%E4%B8%AA%E4%BA%BA%E7%9B%B4%E8%BF%9E.list
ruleset=🛸 个人代理,https://cdn.jsdelivr.net/gh/yangdong123/clash@dev/%E4%B8%AA%E4%BA%BA%E4%BB%A3%E7%90%86.list

; 服务规则：全部改用 blackmatrix7 官方列表（不再依赖 liandu2024 的 AI.list）。
; 该 list 混入了 bing.com / x.com / stripe.com / sentry.io / intercom.io 等非 AI 域名，
; 会导致 cn.bing.com 被代理，原版为此打的 “Twitter 必须排在 AI1 之前” 补丁也从根上不需要了。
ruleset=🕊️ Twitter(X),https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Twitter/Twitter.list
ruleset=✨ AI1,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/OpenAI/OpenAI.list
